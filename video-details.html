<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="assets/img/Favicon.jpg" rel="icon">
<link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">

<link href="assets/vendor/aos/aos.css" rel="stylesheet">
<link href="assets/css/main.css" rel="stylesheet">
<style>
.video-player { width:100%; aspect-ratio:16/9; background:#080808; border-radius:12px; display:block; }
.video-notice {font-size:.95rem;color:#555;margin-top:12px}
.video-selector {display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.video-selector a {border:1px solid #d9dce1;padding:8px 12px;border-radius:8px;color:inherit;text-decoration:none}
.video-selector a.active {background:#122b50;color:white;border-color:#122b50}
</style>
</head>
<body class="portfolio-details-page">
<header id="header" class="header d-flex align-items-center sticky-top">
 <div class="container-fluid container-xl position-relative d-flex align-items-center justify-content-between">
  <a href="index.html" class="logo d-flex align-items-center"><h1 class="sitename">Studio L.</h1></a>
  <nav id="navmenu" class="navmenu"><ul><li><a href="index.html#hero">Home</a></li><li><a href="index.html#about">About</a></li><li><a href="index.html#portfolio">Portfolio</a></li></ul><i class="mobile-nav-toggle d-xl-none bi bi-list"></i></nav>
 </div>
</header>
<main class="main">
<div class="page-title light-background"><div class="container d-lg-flex justify-content-between align-items-center"><h1 class="mb-2 mb-lg-0">Video Details</h1><nav class="breadcrumbs"><ol><li><a href="index.html">Home</a></li><li><a href="index.html#portfolio">Portfolio</a></li><li class="current">Video</li></ol></nav></div></div>
<section id="portfolio-details" class="portfolio-details section"><div class="container" data-aos="fade-up" data-aos-delay="100"><div class="row gy-4">
<div class="col-lg-8"><video id="project-video" class="video-player" controls playsinline preload="metadata"><source id="video-source" src="" type="video/mp4">이 브라우저는 동영상 재생을 지원하지 않습니다.</video><p class="video-notice" id="video-notice">영상 파일은 assets/video 폴더에 넣어주세요.</p><div class="video-selector" id="video-selector" aria-label="영상 선택"></div></div>
<div class="col-lg-4"><div class="portfolio-info"><h3>Project Information</h3><ul><li><strong>Category</strong>: Video</li><li><strong>Project</strong>: <span id="project-label"></span></li><li><strong>File</strong>: <span id="project-file"></span></li></ul></div><div class="portfolio-description"><h2 id="project-heading"></h2><p>영상 포트폴리오 프로젝트입니다.</p><a href="index.html#portfolio">← Portfolio로 돌아가기</a></div></div>
</div></div></section>
</main>
<footer id="footer" class="footer light-background"><div class="container text-center"><h3 class="sitename">Studio L.</h3><p>Design · Figma · Motion</p></div></footer>
<a href="#" id="scroll-top" class="scroll-top d-flex align-items-center justify-content-center"><i class="bi bi-arrow-up-short"></i></a>
<script>
const projects = [
  {id:"01", title:"Coffee", file:"Thumb_V01.coffee.mp4"},
  {id:"02", title:"Food", file:"Thumb_V02.food.mp4"},
  {id:"03", title:"Resort", file:"Thumb_V03.resort.mp4"},
  {id:"04", title:"Place", file:"Thumb_V04.place.mp4"},
  {id:"05", title:"Airplane", file:"Thumb_V05.airplane.mp4"},
  {id:"06", title:"Shorts 01", file:"Thumb_V06.Shorts.mp4"},
  {id:"07", title:"Motion Graphic", file:"Thumb_V07.dongback.mp4"}
];
const params = new URLSearchParams(location.search);
const selected = projects.find(p => p.id === params.get('video')) || projects[0];
const video = document.getElementById('project-video');
const src = 'assets/video/' + selected.file;
document.getElementById('video-source').src = src;
video.poster = 'assets/img/thumbnails/Thumb_V' + selected.id + '.jpg';
video.load();
document.getElementById('project-label').textContent = selected.title;
document.getElementById('project-file').textContent = selected.file;
document.getElementById('project-heading').textContent = 'Video ' + selected.id + ' · ' + selected.title;
document.title = 'Video ' + selected.id + ' | Studio L.';
document.getElementById('video-selector').innerHTML = projects.map(p => '<a '+(p.id===selected.id?'class="active" ':'')+'href="video-details.html?video='+p.id+'">Video '+p.id+'</a>').join('');
video.addEventListener('error', () => {document.getElementById('video-notice').textContent = '영상 파일을 불러올 수 없습니다. assets/video/' + selected.file + ' 경로와 파일명을 확인하세요.';});
</script>
<script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="assets/vendor/aos/aos.js"></script>
<script src="assets/js/main.js"></script>
</body></html>
